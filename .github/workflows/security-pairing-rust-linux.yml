name: SEC-01 Linux Rust pairing authority policy (pre-integration)

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  linux-pairing-authority-core:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Verify standalone Linux Rust authority package and pinned dependencies
        shell: bash
        env:
          RUSTFLAGS: "-D warnings"
        run: |
          set -euo pipefail
          cargo build --locked --manifest-path server-rs/Cargo.toml --all-targets

      - name: Run SEC-01 revocation/replay, legacy audit and SEC-08 process locks
        shell: bash
        env:
          RUSTFLAGS: "-D warnings"
        run: |
          set -euo pipefail
          cargo test --locked --manifest-path server-rs/Cargo.toml -- --test-threads=1 --nocapture

      - name: SEC-02 bounded handshake and post-handshake one-request HTTP resource policy lab (feature off)
        shell: bash
        env:
          RUSTFLAGS: "-D warnings"
        run: |
          set -euo pipefail
          cargo test --locked --manifest-path server-rs/Cargo.toml \
            --features linux-handshake-admission --lib handshake_admission::tests \
            -- --test-threads=1 --nocapture
          # Strict HTTP/1.1 framing must pass real loopback TCP negative tests.
          cargo test --locked --manifest-path server-rs/Cargo.toml --features linux-handshake-admission --lib http_one_request::tests -- --test-threads=1 --nocapture
          grep -F 'pub fn read_one_request' server-rs/src/http_one_request.rs
          ! grep -F 'http_one_request' src/pairhost.rs
          # This is a policy with ephemeral loopback test listeners only;
          # production remains the original Python receiver.
          grep -F 'linux-handshake-admission = []' server-rs/Cargo.toml
          ! grep -F 'linux-handshake-admission' src/pairhost.rs
          grep -F 'pub fn spawn_one_request' server-rs/src/handshake_admission.rs
          grep -F 'pub struct RequestAdmission' server-rs/src/handshake_admission.rs
          grep -F 'ExecStart=/usr/bin/python3 -I ' src/pairhost.rs >/dev/null

      - name: SEC-02 real rustls TLS1.2 decrypted HTTP wire lab (feature OFF by default)
        shell: bash
        env:
          RUSTFLAGS: "-D warnings"
        run: |
          set -euo pipefail
          openssl version
          cargo test --locked --manifest-path server-rs/Cargo.toml \
            --features linux-tls-wire-lab --lib tls_wire::tests -- \
            --test-threads=1 --nocapture
          # Both encrypted transport and HTTP decoder compile in one feature.
          cargo test --locked --manifest-path server-rs/Cargo.toml \
            --features linux-tls-wire-lab --lib http_one_request::tests -- \
            --test-threads=1
          grep -F 'linux-tls-wire-lab = ["linux-handshake-admission", "dep:rustls"]' server-rs/Cargo.toml
          ! grep -F 'linux-tls-wire-lab' src/pairhost.rs
          grep -F 'ExecStart=/usr/bin/python3 -I ' src/pairhost.rs >/dev/null

      - name: SEC-02 Rust TLS1.2 fail-closed HTTP JSON response wire lab (feature OFF)
        shell: bash
        env:
          RUSTFLAGS: "-D warnings"
        run: |
          set -euo pipefail
          # This builds the same Rust code in non-test mode, not just cfg(test).
          cargo build --locked --manifest-path server-rs/Cargo.toml \
            --features linux-http-deny-response-lab --lib
          cargo test --locked --manifest-path server-rs/Cargo.toml \
            --features linux-http-deny-response-lab --lib http_fail_closed::tests -- \
            --test-threads=1 --nocapture
          cargo test --locked --manifest-path server-rs/Cargo.toml \
            --features linux-http-deny-response-lab --lib tls_wire::tests -- \
            --test-threads=1 --nocapture
          grep -F 'linux-http-deny-response-lab = ["linux-tls-identity-lab"]' server-rs/Cargo.toml
          ! grep -F 'linux-http-deny-response-lab' src/pairhost.rs
          grep -F 'ExecStart=/usr/bin/python3 -I ' src/pairhost.rs >/dev/null

      - name: SEC-02 real bounded localhost accept + TLS1.2 denial-only adversarial loopback
        shell: bash
        env:
          RUSTFLAGS: "-D warnings"
        run: |
          set -euo pipefail
          # Compile opt-in production-shaped library WITHOUT cfg(test).
          # The default binary, old Python systemd unit and public port stay untouched.
          cargo build --locked --manifest-path server-rs/Cargo.toml \
            --features linux-bounded-accept-lab --lib
          cargo test --locked --manifest-path server-rs/Cargo.toml \
            --features linux-bounded-accept-lab --lib http_fail_closed::tests -- \
            --test-threads=1 --nocapture
          cargo test --locked --manifest-path server-rs/Cargo.toml \
            --features linux-bounded-accept-lab --lib tls_wire::tests -- \
            --test-threads=1 --nocapture
          grep -F 'linux-bounded-accept-lab = ["linux-http-deny-response-lab"]' server-rs/Cargo.toml
          grep -F 'listener.local_addr()?.ip().is_loopback()' server-rs/src/loopback_denial_lab.rs
          ! grep -F 'linux-bounded-accept-lab' src/pairhost.rs
          grep -F 'ExecStart=/usr/bin/python3 -I ' src/pairhost.rs >/dev/null

      - name: SEC-02 read-only root-owned TLS PEM pin and no-symlink lab
        shell: bash
        env:
          RUSTFLAGS: "-D warnings"
        run: |
          set -euo pipefail
          openssl version
          # Verify the feature-enabled NON-TEST Rust library compiles with
          # the same strict warnings; unit tests can hide unused imports.
          cargo build --locked --manifest-path server-rs/Cargo.toml \
            --features linux-tls-identity-lab --lib
          cargo test --locked --manifest-path server-rs/Cargo.toml \
            --features linux-tls-identity-lab --lib tls_identity::tests -- \
            --test-threads=1 --nocapture
          # Recheck real encrypted TLS and the original strict HTTP parser
          # under the stronger identity feature (no disabled tests).
          cargo test --locked --manifest-path server-rs/Cargo.toml \
            --features linux-tls-identity-lab --lib tls_wire::tests -- \
            --test-threads=1
          cargo test --locked --manifest-path server-rs/Cargo.toml \
            --features linux-tls-identity-lab --lib http_one_request::tests -- \
            --test-threads=1
          grep -F 'linux-tls-identity-lab = ["linux-tls-wire-lab", "dep:zeroize"]' server-rs/Cargo.toml
          ! grep -F 'linux-tls-identity-lab' src/pairhost.rs
          grep -F 'ExecStart=/usr/bin/python3 -I ' src/pairhost.rs >/dev/null

      - name: Compile and test opt-in Rust root-only terminal finalization policy
        shell: bash
        env:
          RUSTFLAGS: "-D warnings"
        run: |
          set -euo pipefail
          cargo test --locked --manifest-path server-rs/Cargo.toml --features linux-admin-finalize --lib admin_terminal::tests -- --test-threads=1
          cargo test --locked --manifest-path server-rs/Cargo.toml --features linux-admin-finalize --bin spidervpn-pair-audit -- --test-threads=1
          set +e
          result=$(cargo run --quiet --locked --manifest-path server-rs/Cargo.toml --features linux-admin-finalize --bin spidervpn-pair-audit -- finalize /var/lib/spidervpn-pair wg0 11111111-1111-4111-8111-111111111111 2>&1)
          code=$?
          set -e
          test "$code" -eq 2
          printf '%s\n' "$result" | grep -F 'root privileges required'

      - name: SEC-01 opt-in old Python cutover read-only preflight denial regression
        shell: bash
        env:
          RUSTFLAGS: "-D warnings"
        run: |
          set -euo pipefail
          cargo build --locked --manifest-path server-rs/Cargo.toml --features linux-cutover-preflight --bin spidervpn-pair-cutover
          cargo test --locked --manifest-path server-rs/Cargo.toml --features linux-cutover-preflight --lib legacy_cutover::tests -- --test-threads=1
          test "$(id -u)" -ne 0
          set +e
          output=$(cargo run --quiet --locked --manifest-path server-rs/Cargo.toml --features linux-cutover-preflight --bin spidervpn-pair-cutover 2>&1)
          code=$?
          set -e
          test "$code" -eq 2
          printf '%s\n' "$output" | grep -F 'NO migration or listener authorization'

      - name: SEC-01 atomic offline legacy Python entrypoint retirement regression (feature off by default)
        shell: bash
        env:
          RUSTFLAGS: "-D warnings"
        run: |
          set -euo pipefail
          cargo test --locked --manifest-path server-rs/Cargo.toml --features linux-legacy-retire --lib legacy_retire::tests -- --test-threads=1
          # No production CLI or service route has been exposed for retirement.
          grep -F 'required-features = ["linux-cutover-preflight"]' server-rs/Cargo.toml >/dev/null
          ! grep -F 'linux-legacy-retire' src/pairhost.rs


      - name: SEC-01 opt-in root-only retire and read-only post-reboot verify CLI regressions
        shell: bash
        env:
          RUSTFLAGS: "-D warnings"
        run: |
          set -euo pipefail
          cargo build --locked --manifest-path server-rs/Cargo.toml --features linux-legacy-retire-cli --bin spidervpn-pair-retire
          cargo test --locked --manifest-path server-rs/Cargo.toml --features linux-legacy-retire-cli --bin spidervpn-pair-retire -- --test-threads=1
          # The hosted runner is NOT root. A real retirement must not occur.
          test "$(id -u)" -ne 0
          set +e
          output=$(cargo run --quiet --locked --manifest-path server-rs/Cargo.toml \
            --features linux-legacy-retire-cli --bin spidervpn-pair-retire -- retire 2>&1)
          code=$?
          set -e
          test "$code" -eq 2
          printf '%s\n' "$output" | grep -F 'root privileges required'
          # Verification, unlike retirement, is read-only; non-root must still
          # be refused before inspecting any real service or filesystem state.
          set +e
          verify_output=$(cargo run --quiet --locked --manifest-path server-rs/Cargo.toml \
            --features linux-legacy-retire-cli --bin spidervpn-pair-retire -- verify 2>&1)
          verify_code=$?
          set -e
          test "$verify_code" -eq 2
          printf '%s\n' "$verify_output" | grep -F 'root privileges required'
          test ! -e /var/lib/tradechannel/pairing-rs/.tc-pair.py.retired
          # This optional binary is never compiled without explicitly enabling
          # the feature, and no Windows SSH or production server path invokes it.
          grep -F 'required-features = ["linux-legacy-retire-cli"]' server-rs/Cargo.toml
          ! grep -F 'spidervpn-pair-retire' src/pairhost.rs

      - name: SEC-01 root-only recovery inspection CLI denies unprivileged invocation
        shell: bash
        env:
          RUSTFLAGS: "-D warnings"
        run: |
          set -euo pipefail
          test "$(id -u)" -ne 0
          set +e
          output=$(cargo run --quiet --locked --manifest-path server-rs/Cargo.toml \
            --bin spidervpn-pair-audit -- inspect \
            /var/lib/spidervpn-pair wg0 11111111-1111-4111-8111-111111111111 2>&1)
          exit_code=$?
          set -e
          test "$exit_code" -eq 2
          printf '%s\n' "$output" | grep -F 'root privileges required'
          test ! -e /var/lib/spidervpn-pair/.pairing-authority.lock

      - name: Verify production pairing runtime is not claimed to be migrated
        shell: bash
        run: |
          set -euo pipefail
          # This core is a migration candidate only. Production remains
          # Python until authenticated API, ledger migration, TLS, WG and
          # real-host rollback are separately validated.
          grep -F 'ExecStart=/usr/bin/python3 -I ' src/pairhost.rs >/dev/null

  linux-kernel-netns-sec01-acceptance:
    # Dedicated privileged integration job: no ignored or skipped security tests.
    # The disposable hosted VM and its netns are never the user's server.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux WireGuard and netns tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y -qq iproute2 wireguard-tools
          test -x /usr/bin/wg
          test -x /usr/bin/script

      - name: Compile the dedicated real-kernel Rust integration test
        shell: bash
        env:
          RUSTFLAGS: "-D warnings"
        run: |
          set -euo pipefail
          export CARGO_TARGET_DIR="$PWD/server-rs/target/netns"
          cargo test --locked --manifest-path server-rs/Cargo.toml --features linux-netns-acceptance,linux-admin-finalize --test wg_namespace_e2e --no-run --message-format=json > "$RUNNER_TEMP/sec01-build.json"
          test_bin="$(jq -r 'select(.reason=="compiler-artifact" and .target.name=="wg_namespace_e2e") | .executable // empty' "$RUNNER_TEMP/sec01-build.json" | tail -n1)"
          test -n "$test_bin"
          test -x "$test_bin"
          printf 'SPIDERVPN_SEC01_TEST_BIN=%s\n' "$test_bin" >> "$GITHUB_ENV"

      - name: Execute root-only audit with actual kernel peers in a disposable netns
        shell: bash
        run: |
          set -euo pipefail
          iface=spiderci0
          ns="spider-sec01-$GITHUB_RUN_ID"
          server_key="$(mktemp)"
          conf="/etc/wireguard/$iface.conf"
          cleanup() {
            sudo rm -f "$conf"
            sudo ip netns del "$ns" 2>/dev/null || true
            rm -f "$server_key"
          }
          trap cleanup EXIT
          umask 077
          /usr/bin/wg genkey > "$server_key"
          client_pub="$(/usr/bin/wg genkey | /usr/bin/wg pubkey)"
          sudo install -d -m 0700 -o 0 -g 0 /etc/wireguard
          test ! -e "$conf"
          sudo ip netns add "$ns"
          sudo ip -n "$ns" link add "$iface" type wireguard
          sudo ip -n "$ns" link set "$iface" up
          sudo ip netns exec "$ns" /usr/bin/wg set "$iface" private-key "$server_key"
          printf '[Interface]\nPrivateKey = %s\nAddress = 10.66.0.1/24\n' "$(cat "$server_key")" | sudo tee "$conf" >/dev/null
          sudo chmod 0600 "$conf"
          test "$(sudo stat -c '%u:%a' "$conf")" = "0:600"
          test -x "$SPIDERVPN_SEC01_TEST_BIN"
          sudo ip netns exec "$ns" /usr/bin/env SPIDERVPN_SEC01_NS_INTERFACE="$iface" SPIDERVPN_SEC01_NS_CLIENT_PUBLIC_KEY="$client_pub" "$SPIDERVPN_SEC01_TEST_BIN" --nocapture
      - name: SEC-02 real UID 0 TLS identity ownership and pin filesystem regression
        shell: bash
        env:
          RUSTFLAGS: "-D warnings"
        run: |
          set -euo pipefail
          export CARGO_TARGET_DIR="$PWD/server-rs/target/netns"
          cargo test --locked --manifest-path server-rs/Cargo.toml \
            --features linux-tls-identity-lab --lib tls_identity::tests \
            --no-run --message-format=json > "$RUNNER_TEMP/sec02-identity-build.json"
          binary="$(jq -r 'select(.reason=="compiler-artifact" and .profile.test==true and (.target.kind | index("lib"))) | .executable // empty' "$RUNNER_TEMP/sec02-identity-build.json" | tail -n1)"
          test -n "$binary"
          test -x "$binary"
          # This VM is disposable. Tests create owner-only folders in /tmp,
          # do not read/overwrite /var/lib/tradechannel or original TLS keys.
          sudo "$binary" tls_identity::tests --test-threads=1 --nocapture

      - name: Execute real root-owned legacy retirement filesystem tests in isolated runner
        shell: bash
        env:
          RUSTFLAGS: "-D warnings"
        run: |
          set -euo pipefail
          export CARGO_TARGET_DIR="$PWD/server-rs/target/netns"
          cargo test --locked --manifest-path server-rs/Cargo.toml --features linux-legacy-retire --lib legacy_retire::tests --no-run --message-format=json > "$RUNNER_TEMP/sec01-retire-build.json"
          binary="$(jq -r 'select(.reason=="compiler-artifact" and .profile.test==true and (.target.kind | index("lib"))) | .executable // empty' "$RUNNER_TEMP/sec01-retire-build.json" | tail -n1)"
          test -n "$binary"
          test -x "$binary"
          # Only test-generated /tmp owner-only directories; never the
          # actual /var/lib/tradechannel pairing service or systemd unit.
          sudo "$binary" legacy_retire::tests --test-threads=1 --nocapture

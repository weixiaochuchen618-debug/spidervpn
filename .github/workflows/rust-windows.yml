name: Rust Windows build and tests

on:
  pull_request:
  workflow_dispatch:

# Only the newest SHA of a PR needs full MSVC validation; older in-flight
# runs are superseded, not counted as green or treated as skipped tests.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  rust-windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Parse the thin PowerShell uninstaller without executing it
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          $file = Join-Path $env:GITHUB_WORKSPACE 'package-files/uninstall.ps1'
          [System.Management.Automation.Language.Parser]::ParseFile($file, [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.ToString() }
            throw "SEC-09 uninstall wrapper has PowerShell syntax errors"
          }

      - name: SEC-03 isolated candidate packaging integrity tests (not a release)
        shell: pwsh
        run: |
          & pwsh -NoProfile -File tests/package-candidate-e2e.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build with Rust
        run: cargo build --locked

      # Run the elevation/DACL negative controls before broad integration tests.
      # An unrelated end-to-end failure must not hide their result.
      - name: SEC-10 protected IPC and privileged engine regressions (MSVC)
        shell: pwsh
        run: |
          foreach ($filter in @('install_trust::tests::', 'uninstall_safety::tests::', 'uiweb_form::tests::sec11_short_time', 'pairing::tunnel::sec11_key_tests::sec11_wireguard_key_shape', 'guard::elevate::tests::', 'secretfile::tests::privileged_ipc_objects_have_secure_acl_at_creation', 'engine::tests::privileged_engine_cannot_be_selected_from_arbitrary_config_path')) {
            Write-Host "Running MSVC Rust security tests: $filter"
            & cargo test --locked --bin spidervpn $filter -- --test-threads=1
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          foreach ($test in @('engine::tests::start_reports_pid_and_process_is_alive', 'engine::tests::actual_token_query_failure_is_not_nonadmin', 'ipc::tests::the_real_probe_rejects_a_program_that_is_not_sing_box')) {
            Write-Host "Running exact MSVC engine entry test: $test"
            $output = & cargo test --locked --bin spidervpn $test -- --exact --nocapture --test-threads=1 2>&1
            $code = $LASTEXITCODE
            $output | ForEach-Object { Write-Host $_ }
            if ($code -ne 0) { exit $code }
            if (($output -join "`n") -notmatch 'test result: ok\. 1 passed; 0 failed; 0 ignored') { throw "Exact engine entry test did not execute once: $test" }
            if (($output -join "`n") -notmatch 'ENGINE_ENTRY_ACTUAL_TOKEN elevated=(true|false)') { throw "Missing actual process token readback: $test" }
          }

      - name: SEC-01 legacy Python SSH writer retirement gate (MSVC)
        shell: pwsh
        run: |
          & cargo test --locked --bin spidervpn legacy_writer_fence::tests -- --test-threads=1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & cargo test --locked --bin spidervpn old_wireguard_writers_refuse_retired_pairing_host_before_side_effects -- --test-threads=1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & cargo test --locked --bin spidervpn sec01_install_transport_restore_are_guarded_before_all_mutations -- --test-threads=1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & cargo test --locked --bin spidervpn sec01_sourced_transport_reads_refuse_retired_pairing_host -- --test-threads=1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: SEC-02 original RSA self-signed certificate pinned client compatibility (MSVC)
        shell: pwsh
        run: |
          & cargo test --locked --bin spidervpn pairing::http::tests::sec02_legacy_rsa_ -- --test-threads=1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Ephemeral WFP IPv4 proxy canary (actual BFE classification)
        shell: pwsh
        env:
          SPIDERVPN_WFP_CANARY: "1"
        run: |
          # Only a dynamic session targeting this test executable; never touch
          # SpiderVPN's persistent WFP provider or the user's firewall.
          & cargo test --locked --test wfp_proxy_canary -- --ignored --test-threads=1 --nocapture
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & cargo test --locked --bin spidervpn guard::lease_helper::tests::real_process_channel_faults_with_bfe -- --ignored --exact --test-threads=1 --nocapture
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Rust integration tests (each integration target, no duplicate binary unit tests)
        shell: pwsh
        run: |
          $testTargets = Get-ChildItem tests -Filter '*.rs' -File | Sort-Object Name
          if (-not $testTargets) { throw '没有找到 Rust 集成测试目标' }
          foreach ($target in $testTargets) {
            $name = [System.IO.Path]::GetFileNameWithoutExtension($target.Name)
            Write-Host "Running Rust integration target: $name"
            & cargo test --locked --test $name -- --test-threads=1
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Regression tests for changed Rust modules
        shell: pwsh
        run: |
          foreach ($module in @('engine_config::tests::', 'proxy::tests::', 'connect::tests::', 'ipc::tests::')) {
            & cargo test --locked --bin spidervpn $module -- --test-threads=1
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      # Eight pre-existing tests require the developer's local DPAPI fixture, sing-box.exe,
      # inherited temp-directory ACLs, or a stable long-form Windows temp path.
      # They are not portable to a fresh GitHub-hosted runner. Do NOT skip the safety
      # regression suites above, and do not misreport the original full-suite failure.
      - name: Portable Rust unit suite (8 environment-dependent cases excluded)
        run: >
          cargo test --locked --bin spidervpn -- --test-threads=1
          --skip dotnet_produced_dpapi_envelopes_open
          --skip qa_a_two_node_line_puts_the_transit_first_and_on_every_endpoint
          --skip qa_joining_with_compatibility_writes_a_standard_line_and_keeps_the_rest
          --skip qa_joining_without_compatibility_never_pretends_to_support_it
          --skip qa_the_engine_accepts_a_transit_outbound_nobody_references
          --skip the_root_scan_covers_all_three_private_key_files
          --skip tightening_closes_a_file_that_inherited_the_loose_acl
          --skip a_shortcut_is_replaced_by_the_program_it_points_at


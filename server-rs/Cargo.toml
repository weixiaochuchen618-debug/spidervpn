[package]
name = "spidervpn-pairing-authority"
version = "0.1.0"
edition = "2021"
publish = false
description = "Rust Linux pairing authority migration candidate; not deployed"

[lib]
path = "src/lib.rs"

[dependencies]
# Exactly the already-vetted versions in the Windows client's Cargo.lock.
# Old invitation JSON is only *audited*, never blindly authorized.
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
# Vetted RSA-SHA256 verifier from the existing Windows Cargo.lock.
ring = "=0.17.14"
# Same version and crypto backend as the Windows client, explicitly OFF by
# default. Real Linux TLS1.2 encrypted loopback lab, NOT deployed receiver.
rustls = { version = "=0.23.46", default-features = false, features = ["ring", "std", "tls12", "logging"], optional = true }
# Zeroize in-memory PEM and protected WG key buffers. Same existing
# vetted version/checksum as the pinned Windows client lock.
zeroize = { version = "=1.9.1", optional = true }
# Existing pinned transitive libc; expose only for the opted-in Linux process lab.
libc = { version = "=0.2.191", optional = true }
# Exact versions in the client lock. Used only for opt-in response issuance.
aes = { version = "=0.8.4", optional = true }
base64 = { version = "=0.23.1", optional = true }
cbc = { version = "=0.1.2", optional = true }
hmac = { version = "=0.12.1", optional = true }
rsa = { version = "=0.9.10", features = ["sha2"], optional = true }
sha2 = { version = "=0.10.9", optional = true }
time = { version = "=0.3.55", optional = true }

[features]
# Only the explicit privileged netns CI job compiles and runs this test.
linux-netns-acceptance = []
# Explicit opt-in; default release has no mutating admin CLI command.
linux-admin-finalize = []
# Explicit opt-in read-only shutdown observer, not an importer or cutover.
linux-cutover-preflight = []
# Compile offline atomic script retirement ONLY on explicit request.
linux-legacy-retire = ["linux-cutover-preflight"]
# A distinct, opt-in root-TTY CLI; no release/default command or HTTP route.
linux-legacy-retire-cli = ["linux-legacy-retire"]
# SEC-02 pre-integration concurrency/deadline policy only; no TLS or listener.
linux-handshake-admission = []
# Build a real rustls TLS1.2 server/client loopback test only on explicit opt-in.
# Never add to default or any deployed binary until server cutover DoD.
linux-tls-wire-lab = ["linux-handshake-admission", "dep:rustls"]
# Strict root-owned no-symlink, single-inode TLS PEM/pin reader. Default OFF;
# no listener, state mutation, client changes, service install or cutover.
linux-tls-identity-lab = ["linux-tls-wire-lab", "dep:zeroize"]
# An opt-in TLS1.2 loopback JSON error envelope only, never pairing approval.
linux-http-deny-response-lab = ["linux-tls-identity-lab"]
# Opt-in localhost-only finite TCP accept loop for the denial-only Rustls lab.
# Never a deployed pairing listener, public port, or authorization handler.
linux-bounded-accept-lab = ["linux-http-deny-response-lab"]
# Opt-in stoppable, long-lived loopback listener; no deployment entry point.
linux-persistent-listener-lab = ["linux-bounded-accept-lab"]
# Explicit disposable process lab, NOT installed or deployed.
linux-denial-process-lab = ["linux-persistent-listener-lab", "dep:libc"]
# Default-off request authentication against an independently trusted invite.
linux-fresh-consume-gate = ["linux-handshake-admission", "dep:zeroize"]
# Internal success response only; does not enable a listener or default daemon.
linux-authorization-response = ["linux-fresh-consume-gate", "dep:aes", "dep:base64", "dep:cbc", "dep:hmac", "dep:rsa", "dep:sha2", "dep:time"]

[[test]]
name = "wg_namespace_e2e"
path = "tests/wg_namespace_e2e.rs"
required-features = ["linux-netns-acceptance"]

[[bin]]
name = "spidervpn-pair-cutover"
path = "src/bin/spidervpn-pair-cutover.rs"
required-features = ["linux-cutover-preflight"]

[[bin]]
name = "spidervpn-pair-retire"
path = "src/bin/spidervpn-pair-retire.rs"
required-features = ["linux-legacy-retire-cli"]

[[bin]]
name = "spidervpn-pair-denial-lab"
path = "src/bin/spidervpn-pair-denial-lab.rs"
required-features = ["linux-denial-process-lab"]

[[test]]
name = "denial_process_e2e"
path = "tests/denial_process_e2e.rs"
required-features = ["linux-denial-process-lab"]
